# The checks AGENTS.md asks for after every material change, plus a build of the production
# image, so they run on every push and pull request instead of only when someone remembers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as the Dockerfile, so a new stable Clippy lint never breaks CI unannounced.
  RUST_TOOLCHAIN: "1.97"

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Poppler is the preferred PDF reader at runtime; tests exercise it when present.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  entrypoint:
    name: container entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/entrypoint_check.sh

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sumline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Catches a missing binary, shared library or Poppler in the runtime stage. --check-config
      # prints booleans only and exits without starting the server.
      - name: Binary and Poppler run inside the image
        run: |
          docker run --rm --entrypoint /app/sumline sumline:ci --check-config
          docker run --rm --entrypoint pdftotext sumline:ci -v
